<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji Flashcards - Back</title>
<style>
    :root {
        /* Standard business card size or slightly larger */
        --card-width: 60mm;
        --card-height: 80mm;
        --grid-gap: 0mm;
    }
    
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        background-color: #f0f0f0;
        font-family: sans-serif;
    }
    
    .page {
        /* A4 dimensions */
        width: 210mm;
        min-height: 297mm;
        padding: 20mm;
        margin: 10mm auto;
        background: white;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .grid {
        display: grid;
        grid-template-columns: repeat(3, var(--card-width));
        grid-template-rows: repeat(3, var(--card-height));
        gap: var(--grid-gap);
    }
    
    .card {
        width: var(--card-width);
        height: var(--card-height);
        border: 1px dashed #ccc;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #333;
        position: relative;
        padding: 5mm;
        text-align: center;
    }
    
    .card-number {
        position: absolute;
        top: 3mm;
        /* Notice the number is on the RIGHT for the back so it aligns with the left on the front */
        right: 3mm; 
        font-size: 3mm;
        color: #aaa;
    }
    
    .reading {
        font-size: 7mm;
        font-weight: bold;
        margin-bottom: 3mm;
        color: #d32f2f; /* Nice red for reading */
    }
    
    .meaning {
        font-size: 5mm;
        font-weight: bold;
        margin-bottom: 5mm;
        color: #2c3e50;
    }
    
    .example-word {
        font-size: 4mm;
        color: #555;
        margin-bottom: 1mm;
    }
    
    .example-reading {
        font-size: 3.5mm;
        color: #7f8c8d;
    }
    
    /* Print specific styling */
    @media print {
        @page {
            size: A4;
            margin: 0;
        }
        body { 
            background: none; 
            -webkit-print-color-adjust: exact;
        }
        .page { 
            margin: 0; 
            padding: 0; 
            box-shadow: none; 
            width: 210mm; 
            height: 297mm;
            min-height: auto;
        }
        .card { 
            border: 0.5px solid #ccc; /* Guidelines for cutting */
        }
    }
</style>
</head>
<body>
    <div class="page">
        <div class="grid">
            <!-- 
                IMPORTANT: For double-sided printing, the back cards must be mirrored horizontally!
                Row 1: Card 3, Card 2, Card 1
                Row 2: Card 6, Card 5, Card 4
                Row 3: Card 9, Card 8, Card 7
            -->
            
            <!-- ROW 1 (Mirrored) -->
            <div class="card">
                <span class="card-number">3</span>
                <div class="reading">サン</div>
                <div class="meaning">Three</div>
                <div class="example-word">三人 (さんにん)</div>
                <div class="example-reading">Three people</div>
            </div>
            <div class="card">
                <span class="card-number">2</span>
                <div class="reading">ニ</div>
                <div class="meaning">Two</div>
                <div class="example-word">二人 (ふたり)</div>
                <div class="example-reading">Two people</div>
            </div>
            <div class="card">
                <span class="card-number">1</span>
                <div class="reading">イチ / イツ</div>
                <div class="meaning">One</div>
                <div class="example-word">一人 (ひとり)</div>
                <div class="example-reading">One person</div>
            </div>

            <!-- ROW 2 (Mirrored) -->
            <div class="card">
                <span class="card-number">6</span>
                <div class="reading">ロク</div>
                <div class="meaning">Six</div>
                <div class="example-word">六月 (ろくがつ)</div>
                <div class="example-reading">June</div>
            </div>
            <div class="card">
                <span class="card-number">5</span>
                <div class="reading">ゴ</div>
                <div class="meaning">Five</div>
                <div class="example-word">五日 (いつか)</div>
                <div class="example-reading">5th day</div>
            </div>
            <div class="card">
                <span class="card-number">4</span>
                <div class="reading">シ</div>
                <div class="meaning">Four</div>
                <div class="example-word">四月 (しがつ)</div>
                <div class="example-reading">April</div>
            </div>

            <!-- ROW 3 (Mirrored) -->
            <div class="card">
                <span class="card-number">9</span>
                <div class="reading">キュウ / ク</div>
                <div class="meaning">Nine</div>
                <div class="example-word">九月 (くがつ)</div>
                <div class="example-reading">September</div>
            </div>
            <div class="card">
                <span class="card-number">8</span>
                <div class="reading">ハチ</div>
                <div class="meaning">Eight</div>
                <div class="example-word">八日 (ようか)</div>
                <div class="example-reading">8th day</div>
            </div>
            <div class="card">
                <span class="card-number">7</span>
                <div class="reading">シチ</div>
                <div class="meaning">Seven</div>
                <div class="example-word">七日 (なのか)</div>
                <div class="example-reading">7th day</div>
            </div>
        </div>
    </div>
</body>
</html>
