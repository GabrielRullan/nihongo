<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas de Kanji - Neko, Taberu y Ooki</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-grey: #64748b;
            --text-romaji-phrase: #475569;
            --accent-indigo: #6366f1;
            --border-color: #f1f5f9;
            --badge-bg: #4f46e5;

            /* Colores de etiquetas */
            --tag-nom-bg: #cbd5e1;
            --tag-nom-text: #334155;
            --tag-ver-bg: #fed7aa;
            --tag-ver-text: #7c2d12;
            --tag-adj-bg: #dcfce7;
            --tag-adj-text: #14532d;
            --tag-grey-bg: #e2e8f0;
            --tag-grey-text: #64748b;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 1200px;
        }

        .card-container {
            width: 320px;
            height: 512px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            border-radius: 24px;
        }

        .card-container.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        .card-front {
            align-items: center;
            justify-content: center;
        }

        .kanji-display {
            font-size: 15rem;
            font-family: "Yu Mincho", "MS Mincho", serif;
            color: var(--text-dark);
            user-select: none;
        }

        .card-back {
            transform: rotateY(180deg);
            padding: 32px;
            justify-content: space-between;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .badge-n5 {
            background-color: var(--badge-bg);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .header-content {
            text-align: center;
            flex-grow: 1;
        }

        ruby {
            font-family: "Yu Mincho", "MS Mincho", serif;
            font-size: 42px;
            color: var(--text-dark);
            ruby-position: over;
        }

        rt {
            font-size: 18px;
            color: var(--text-grey);
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .romaji-header {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-indigo);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 4px 0 0 0;
        }

        .illustration-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .icon-svg {
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .meaning-text {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0;
        }

        /* Contenedor de etiquetas para permitir separación */
        .tag-container {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .type-tag {
            font-size: 14px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 6px;
            text-transform: lowercase;
        }

        .tag-nom {
            background-color: var(--tag-nom-bg);
            color: var(--tag-nom-text);
        }

        .tag-ver {
            background-color: var(--tag-ver-bg);
            color: var(--tag-ver-text);
        }

        .tag-adj {
            background-color: var(--tag-adj-bg);
            color: var(--tag-adj-text);
        }

        .tag-g2 {
            background-color: var(--tag-grey-bg);
            color: var(--tag-grey-text);
        }

        .phrase-section {
            width: 100%;
            text-align: center;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .phrase-jp {
            font-size: 18px;
            color: var(--text-grey);
            margin-bottom: 6px;
        }

        .phrase-romaji {
            font-size: 18px;
            color: var(--text-romaji-phrase);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .phrase-es {
            font-size: 17px;
            color: var(--text-grey);
            font-style: italic;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="container-wrapper">
        <!-- TARJETA 1: NEKO -->
        <div class="card-container">
            <div class="card-inner">
                <div class="card-face card-front">
                    <span class="kanji-display">猫</span>
                </div>
                <div class="card-face card-back">
                    <div class="header">
                        <div style="width: 40px;"></div>
                        <div class="header-content">
                            <ruby>猫<rt>ねこ</rt></ruby>
                            <p class="romaji-header">neko</p>
                        </div>
                        <div class="badge-n5">N5</div>
                    </div>
                    <div class="illustration-box">
                        <svg class="icon-svg" width="110" height="110" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M12 5c.67 0 1.35.09 2 .26V5a2 2 0 0 1 2-2 2 2 0 0 1 2 2v3.76c.65.99 1 2.15 1 3.24 0 3.31-2.69 6-6 6s-6-2.69-6-6c0-1.09.35-2.25 1-3.24V5a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.26c.65-.17 1.33-.26 2-.26zM15 11h-1a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2zm-6 0a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2H9z" />
                        </svg>
                        <p class="meaning-text">Gato</p>
                        <div class="tag-container">
                            <span class="type-tag tag-nom">nom.</span>
                        </div>
                    </div>
                    <div class="phrase-section">
                        <div class="phrase-jp">猫が好きです。</div>
                        <div class="phrase-romaji">neko ga suki desu.</div>
                        <p class="phrase-es">"Me gustan los gatos."</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- TARJETA 2: TABERU -->
        <div class="card-container">
            <div class="card-inner">
                <div class="card-face card-front">
                    <span class="kanji-display">食</span>
                </div>
                <div class="card-face card-back">
                    <div class="header">
                        <div style="width: 40px;"></div>
                        <div class="header-content">
                            <ruby>食べる<rt>たべる</rt></ruby>
                            <p class="romaji-header">taberu</p>
                        </div>
                        <div class="badge-n5">N5</div>
                    </div>
                    <div class="illustration-box">
                        <svg class="icon-svg" width="110" height="110" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                            <path d="M7 2v20" />
                            <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
                        </svg>
                        <p class="meaning-text">Comer</p>
                        <div class="tag-container">
                            <span class="type-tag tag-ver">ver.</span>
                            <span class="type-tag tag-g2">G2</span>
                        </div>
                    </div>
                    <div class="phrase-section">
                        <div class="phrase-jp">リンゴを食べます。</div>
                        <div class="phrase-romaji">ringo o tabemasu.</div>
                        <p class="phrase-es">"Como una manzana."</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- TARJETA 3: OOKI -->
        <div class="card-container">
            <div class="card-inner">
                <div class="card-face card-front">
                    <span class="kanji-display">大</span>
                </div>
                <div class="card-face card-back">
                    <div class="header">
                        <div style="width: 40px;"></div>
                        <div class="header-content">
                            <ruby>大きい<rt>おおきい</rt></ruby>
                            <p class="romaji-header">ooki</p>
                        </div>
                        <div class="badge-n5">N5</div>
                    </div>
                    <div class="illustration-box">
                        <svg class="icon-svg" width="110" height="110" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h6v6" />
                            <path d="M9 21H3v-6" />
                            <path d="M21 3l-7 7" />
                            <path d="M3 21l7-7" />
                        </svg>
                        <p class="meaning-text">Grande</p>
                        <div class="tag-container">
                            <span class="type-tag tag-adj">adj.</span>
                        </div>
                    </div>
                    <div class="phrase-section">
                        <div class="phrase-jp">家は大きいです。</div>
                        <div class="phrase-romaji">ie wa ookii desu.</div>
                        <p class="phrase-es">"La casa es grande."</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.card-container').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('is-flipped');
            });
        });
    </script>

</body>

</html>
